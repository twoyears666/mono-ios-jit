name: Build Mono Runtime

# 目标：产出一个「开着 JIT」的 arm64 Mono 运行时 dylib，
# 再把它的构建平台改成 iOS，供 TrollStore 注入的加载器 dlopen。
# 官方 ios-arm64 运行时包是 -DDISABLE_JIT 编的，JIT trampoline全是 assert，
# 所以必须自己编一份（PojavLauncher 自带 JRE 是同一思路）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 与打包沿用的 BCL 版本严格对齐：CoreLib 里的内部调用是按同一 patch 版本编的
  RUNTIME_TAG: v8.0.20
  OUT_DYLIB: libmonosgen-ios-arm64-jit.dylib

jobs:
  # === 编译运行时 —— 在本机 macOS arm64 上原生编，产物才是 arm64 JIT ===
  build:
    name: 编译运行时
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: 打印工具链版本
        run: |
          sw_vers
          xcodebuild -version
          clang --version | head -1

      - name: 拉取 dotnet/runtime 源码
        run: |
          # 必须用 git clone：tarball 没有 git 元数据，versioning.targets 会因为
          # 生成不了 Native SourceLink 文件而直接报错
          git clone --depth 1 --branch "${RUNTIME_TAG}" https://github.com/dotnet/runtime.git runtime
          ls runtime | head

      - name: 修补已知编译错误
        working-directory: runtime
        run: |
          # 新版本 clang 把宏参数里的 bool 展开成 _Bool，导致 icall.c 里
          # ICALL_SIG_TYPE_##a 拼出未定义的 ICALL_SIG_TYPE__Bool。
          # 补一个同值别名即可（枚举值必须保持不变）。
          python3 - <<'PY'
          p = 'src/mono/mono/metadata/icall.c'
          s = open(p).read()
          if 'ICALL_SIG_TYPE__Bool' not in s:
              s = s.replace('\tICALL_SIG_TYPE_bool     = 0x00,',
                            '\tICALL_SIG_TYPE_bool     = 0x00,\n\tICALL_SIG_TYPE__Bool    = 0x00,', 1)
              open(p, 'w').write(s)
              print('已打补丁')
          else:
              print('补丁已存在')
          PY

      - name: 适配 iOS 的代码页语义
        working-directory: runtime
        run: |
          python3 - <<'PY'
          # Apple Silicon 上 mono 会无条件给可执行页加 MAP_JIT，
          # iOS 的 mmap 不认识这个标志（EINVAL）。
          # 去掉这一处之后：macOS 走上面 hardened runtime 探测的结果，
          # iOS 探测能直接拿到 RWX，于是走普通映射。
          p = 'src/mono/mono/utils/mono-mmap.c'
          s = open(p).read()
          old = "\t\tif (__builtin_available (macOS 11, *))\n\t\t\tmflags |= MAP_JIT;"
          if old in s:
              s = s.replace(old, "\t\t/* iOS 不认 MAP_JIT，保持普通 RWX */")
              open(p, 'w').write(s)
              print('mmap: 已移除强制 MAP_JIT')
          else:
              print('mmap: 目标代码不存在或已改过')
          PY

      - name: 编译 Mono 运行库
        working-directory: runtime
        run: |
          set -o pipefail   # 不加的话 tee 会把 build.sh 的失败退出码吞掉
          ./build.sh mono.runtime -os osx -arch arm64 -c Release 2>&1 | tee ../build.log
      - name: 找出产物 dylib
        run: |
          find runtime/artifacts -name 'libmonosgen-2.0.dylib' -o -name 'libmonosgen-2.0.*.dylib' | head -20

      - name: 校验 JIT trampoline 是真实现
        run: |
          SRC=$(find runtime/artifacts -name 'libmonosgen-2.0*.dylib' | head -1)
          echo "产物: $SRC"
          # 有 JIT 的版本里，这些符号的实现在 tramp-arm64.c，
          # 反汇编里不该只有一条 brk #1（assert）
          nm -g "$SRC" | grep -E "mono_arch_create_sdb_trampoline|mono_arch_get_unbox_trampoline|mono_jit_init_version" || true
          echo "$SRC" > dylib_path.txt

      - name: 改构建平台为 iOS 并签名
        run: |
          mkdir -p out
          SRC=""
          # runtime 子集默认 -DDISABLE_SHARED_LIBS=1，只产出静态库
          if [ -s dylib_path.txt ]; then
            SRC=$(cat dylib_path.txt)
          fi
          if [ -n "$SRC" ] && [ -f "$SRC" ]; then
            cp "$SRC" "out/$OUT_DYLIB"
          else
            LIB=$(find runtime/artifacts -name 'libmonosgen-2.0.a' ! -path '*cross*' ! -path '*/bin/*' | head -1)
            echo "静态库: $LIB"
            test -n "$LIB"
            # 组件（debugger / diagnostics / hot_reload / marshal-ilgen）是独立静态库，要一起链。
            # 只在静态库同目录取，且排除 stub 版：
            #   - 同一份库在 out/lib、cross/out/lib、bin/ 各有一份副本，
            #     全收进来会让 -all_load 链进三份实现，报一堆 duplicate symbol
            #   - *-stub-static.a 与真实组件定义同名入口，只留真实组件
            LIBDIR=$(dirname "$LIB")
            COMPS=$(find "$LIBDIR" -maxdepth 1 -name '*-static.a' ! -name '*-stub-static.a' | tr '\n' ' ')
            echo "组件库: $COMPS"
            # 用 printf 写 stub：YAML 块标量会给每行补缩进，
            # heredoc 的结束符会被缩进带走，导致 shell 提前报 EOF
            printf '%s\n' \
              '#include <dlfcn.h>' \
              '/* 静态 mono 引用了 ICU 全球化入口，iOS 上走不到这里 */' \
              'void *GlobalizationResolveDllImport(const char *name)' \
              '{' \
              '    (void)name;' \
              '    return 0;' \
              '}' \
              '/* iOS 的 libSystem 没有这个接口，有就转发，没有就空操作 */' \
              'void pthread_jit_write_protect_np(int enabled)' \
              '{' \
              '    static void (*real)(int);' \
              '    static int looked;' \
              '    if (!looked) {' \
              '        void *lib = dlopen("/usr/lib/libSystem.B.dylib", RTLD_NOW);' \
              '        if (lib != NULL)' \
              '            real = (void (*)(int))dlsym(lib, "pthread_jit_write_protect_np");' \
              '        looked = 1;' \
              '    }' \
              '    if (real != NULL)' \
              '        real(enabled);' \
              '}' > stub.c
            # 静态 mono 需要整包链入：icall 注册表靠 section 里的符号表，
            # 不加 -all_load 链接器会把没人引用的 icall 全丢掉
            clang -arch arm64 -dynamiclib -o "out/$OUT_DYLIB" \
              -Wl,-all_load "$LIB" $COMPS stub.c \
              -framework CoreFoundation -framework Foundation -framework Security \
              -framework SystemConfiguration -lz -liconv -lc++
          fi
          # macOS 版 mono 与 iOS 的 CPU/ABI 一致，只登记的平台号不同
          vtool -set-build-version ios 15.0 16.4 -replace -output "out/$OUT_DYLIB" "out/$OUT_DYLIB"
          # macOS SDK 记的框架路径是 X.framework/Versions/A/X（Foundation 是 Versions/C），
          # iOS 上框架直接在 X.framework/X，不改这两条 dlopen 会报 Library not loaded
          install_name_tool \
            -change /System/Library/Frameworks/CoreFoundation.framework/Versions/A/CoreFoundation \
                    /System/Library/Frameworks/CoreFoundation.framework/CoreFoundation \
            -change /System/Library/Frameworks/Foundation.framework/Versions/C/Foundation \
                    /System/Library/Frameworks/Foundation.framework/Foundation \
            -change /System/Library/Frameworks/Security.framework/Versions/A/Security \
                    /System/Library/Frameworks/Security.framework/Security \
            -change /System/Library/Frameworks/SystemConfiguration.framework/Versions/A/SystemConfiguration \
                    /System/Library/Frameworks/SystemConfiguration.framework/SystemConfiguration \
            "out/$OUT_DYLIB"
          otool -L "out/$OUT_DYLIB"
          # 兜底校验：还有 Versions/ 说明有框架路径没改到，真机上必崩
          if otool -L "out/$OUT_DYLIB" | grep -q "Versions/"; then
            echo "仍有 macOS 框架路径未改写" >&2
            exit 1
          fi
          # 这个符号只有 Apple Silicon macOS 有，必须由我们自带实现，
          # 否则真机 dlopen 直接报 Symbol not found
          nm -g "out/$OUT_DYLIB" | grep -q " T _pthread_jit_write_protect_np" || {
            echo "缺少 pthread_jit_write_protect_np 实现" >&2
            exit 1
          }
          codesign -f -s - "out/$OUT_DYLIB"
          otool -l "out/$OUT_DYLIB" | grep -A3 LC_BUILD_VERSION | head -6
          codesign -dvv "out/$OUT_DYLIB" 2>&1 | head -5
          ls -la out

      - name: 打包产物
        run: |
          mkdir -p pkg/Frameworks pkg/bcl
          cp "out/$OUT_DYLIB" pkg/Frameworks/libmonosgen-2.0.dylib
          # 托管 BCL 与平台无关，直接沿用官方 ios-arm64 运行时包；
          # libSystem.*.dylib 是 BCL 里 P/Invoke 的目标（Environment/Socket/加密），
          # 少一个就会在 mono 初始化阶段抛 DllNotFoundException
          curl -fsSL "https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.mono.ios-arm64/8.0.20/microsoft.netcore.app.runtime.mono.ios-arm64.8.0.20.nupkg" -o pack.nupkg
          mkdir -p bcl && (cd bcl && unzip -qo ../pack.nupkg 'runtimes/ios-arm64/native/*.dll' 'runtimes/ios-arm64/native/*.dat' 'runtimes/ios-arm64/native/libSystem.*.dylib')
          cp bcl/runtimes/ios-arm64/native/*.dll bcl/runtimes/ios-arm64/native/*.dat pkg/bcl/
          cp bcl/runtimes/ios-arm64/native/libSystem.*.dylib pkg/Frameworks/
          for f in pkg/Frameworks/*.dylib; do codesign -f -s - "$f"; done
          ls -la pkg/Frameworks pkg/bcl | head -20
          cd pkg && zip -qry ../Mono-IOS-JIT.zip . && cd ..
          ls -la Mono-IOS-JIT.zip

      - name: 汇总编译错误（失败时）
        if: failure()
        run: |
          echo "== 构建日志尾部 =="
          tail -80 build.log 2>/dev/null || echo "（没有 build.log）"

      - name: 上传运行时产物
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Mono-IOS-JIT
          path: Mono-IOS-JIT.zip
          if-no-files-found: error
          retention-days: 30

      - name: 上传编译日志（失败时）
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7
